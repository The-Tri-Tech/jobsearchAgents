[project]
name = "jobsearch-backend"
version = "0.1.0"
description = "Job Search Agents - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "groq>=1.7.0",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
